name: Production portrait smoke
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'automation/portrait-smoke.cjs'
      - '.github/workflows/production-portrait.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portrait:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify main portrait rendering
        run: node automation/portrait-smoke.cjs
      - name: Upload portrait screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-portrait
          path: automation/portrait-evidence/
          if-no-files-found: warn
          retention-days: 14
