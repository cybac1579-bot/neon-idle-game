name: Expedition duplicated relic combat observation
on:
  push:
    branches:
      - integration/reconcile-main-redesign-20261114
    paths:
      - 'tests/expedition-relic-visible-combat-audit.cjs'
      - '.github/workflows/expedition-relic-visible-combat.yml'
      - 'site/expedition-engine.js'
  workflow_dispatch:
concurrency:
  group: expedition-relic-visible-combat-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replay real 180-second battles with different relic copy counts
        run: node tests/expedition-relic-visible-combat-audit.cjs
      - name: Upload battle damage and visual cue data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expedition-relic-visible-combat
          path: artifacts/expedition/relic-visible-combat.json
          if-no-files-found: warn
          retention-days: 30
