name: Portrait integration safety checks
on:
  push:
    branches:
      - integration/portrait-first-playable-20261114
  pull_request:
    paths:
      - 'site/**'
      - 'automation/save-regression.test.cjs'
      - '.github/workflows/portrait-integration.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated portrait CSS and unchanged game logic
        run: |
          test -s site/portrait-integration.css
          grep -q 'href="portrait-integration.css"' site/index.html
          git diff dbfb7a759f2f4d4947db4fdb3fc18c5bbbf03fb1 HEAD -- site/game.js | grep -q '^$' || { echo 'Game logic changed'; exit 1; }
      - name: Existing save and gameplay regression suite
        run: node --test automation/save-regression.test.cjs
