name: Portrait integration safety checks
on:
  push:
    branches:
      - integration/portrait-first-playable-20261114
  pull_request:
    paths:
      - 'site/**'
      - 'automation/save-regression.test.cjs'
      - '.github/workflows/portrait-integration.yml'
permissions:
  contents: read
concurrency:
  group: portrait-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify portrait assets and game script syntax
        run: |
          test -s site/portrait-integration.css
          grep -q 'href="portrait-integration.css"' site/index.html
          grep -q 'src="cosmetics.js"' site/index.html
          grep -q 'id="heroImage"' site/index.html
          test -s site/cosmetics.js
          node --check site/cosmetics.js
          node -e "const fs=require('fs');const s=fs.readFileSync('site/cosmetics.js','utf8');if(!s.includes('neon_cosmetic_v1')||s.includes('neon_rework_07'))process.exit(1)"
          node --check site/game.js
          node --check automation/local-preview.cjs
      - name: Verify public preview cannot deploy automatically
        run: node automation/pages-release-safety.test.cjs
      - name: Existing save and gameplay regression suite
        run: node --test automation/save-regression.test.cjs
      - name: Install browser smoke dependency and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real Chromium portrait navigation and touch smoke
        run: node automation/portrait-browser-smoke.cjs
      - name: Build install-oriented static mobile web package
        run: node automation/build-mobile-web.cjs
      - name: Verify packaged icons and game entry
        run: |
          test -s dist/neon-idle/index.html
          test -s dist/neon-idle/app-icon-192.png
          test -s dist/neon-idle/app-icon-512.png
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('dist/neon-idle/manifest.webmanifest','utf8'));if(m.icons.length!==2||!m.icons.every(x=>x.type==='image/png'))process.exit(1)"
      - name: Smoke test the actual packaged web bundle over HTTP
        run: node automation/packaged-browser-smoke.cjs
      - name: Upload packaged portrait screenshots for visual review
        uses: actions/upload-artifact@v4
        with:
          name: neon-idle-portrait-visual-evidence
          path: dist/preview-screenshots/
          retention-days: 7
      - name: Upload first-playable web bundle for testing
        uses: actions/upload-artifact@v4
        with:
          name: neon-idle-portrait-web-preview
          path: dist/neon-idle/
          retention-days: 7
