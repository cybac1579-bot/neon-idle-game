name: Redesign static smoke checks
on:
  push:
    branches:
      - development/reference-redesign
  pull_request:
    paths:
      - 'site/**'
      - 'tests/redesign-static.test.cjs'
      - 'tests/redesign-browser.test.cjs'
      - '.github/workflows/redesign-checks.yml'
  workflow_dispatch:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run redesign static checks
        run: node tests/redesign-static.test.cjs

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run portrait browser smoke
        run: node tests/redesign-browser.test.cjs
      - name: Upload portrait screenshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redesign-browser-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
